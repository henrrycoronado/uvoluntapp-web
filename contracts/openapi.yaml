openapi: 3.0.3
info:
  title: Uvoluntapp API
  description: |
    API central de Uvoluntapp — sistema de la Pastoral Universitaria UCB Santa Cruz
    para programas y actividades de voluntariado.

    Este contrato cubre M1 (cuentas, sesión y roles) y M2 (periodos, programas y actividades).
    Versión v1 congelada al cierre del bloque 1; después solo cambios aditivos.
  version: 1.0.0-draft
  license:
    name: Proprietary
  contact:
    name: Equipo Uvoluntapp

servers:
  - url: /api/v1
    description: Base path de la API v1

tags:
  - name: Auth
    description: Registro, OTP, inicio y cierre de sesión, Google, recuperación de contraseña (SCRUM-55, 56, 104, 105)
  - name: Accounts
    description: Aprobación de cuentas externas (SCRUM-108)
  - name: Founders
    description: Invitación de fundadores — solo documentación; no hay endpoint público (SCRUM-106)
  - name: AdminGrants
    description: Solicitudes y aprobaciones de nuevos ADMIN (SCRUM-107)
  - name: RoleAssignments
    description: Asignación y revocación de roles contextuales (M1)
  - name: Profile
    description: Consulta y edición de perfil propio (SCRUM-59)
  - name: Users
    description: Gestión de usuarios, suspensión (SCRUM-61)
  - name: AuditEvents
    description: Consulta de eventos de auditoría (SCRUM-60)
  - name: AcademicPeriods
    description: Periodos académicos (SCRUM-46)
  - name: Programs
    description: Programas de voluntariado (SCRUM-45, 103)
  - name: ProgramPeriods
    description: Vinculación de programas a periodos académicos
  - name: Activities
    description: Actividades de voluntariado (SCRUM-47, 48, 49, 50, 53)
  - name: ActivityReschedules
    description: Reprogramación de actividades (SCRUM-51)
  - name: Catalog
    description: Catálogo público sin autenticación (SCRUM-52)

security:
  - BearerAuth: []

paths:
  # ──────────────────────────────────────────────
  # AUTH — Registro, OTP, sesión, Google, recuperación
  # ──────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar una cuenta nueva
      description: |
        Acepta correo institucional (`@ucb.edu.bo`) o externo.
        Envía OTP de 6 dígitos al correo (válido 10 min, máx 5 intentos).
        Respuesta no reveladora sobre existencia del correo.
        SCRUM-55.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OTP enviado (respuesta genérica no reveladora)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verificar OTP de registro
      description: |
        Valida el código OTP. Institucional verificado → ACTIVE.
        Externo verificado → PENDING_APPROVAL con solicitud de datos adicionales.
        SCRUM-55.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Verificación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/complete-registration:
    post:
      tags: [Auth]
      summary: Completar registro de cuenta externa
      description: |
        Tras verificar OTP, las cuentas externas completan la solicitud
        con datos personales. La cuenta queda en PENDING_APPROVAL.
        SCRUM-55.
      operationId: completeRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRegistrationRequest'
      responses:
        '200':
          description: Solicitud de aprobación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión con correo y contraseña
      description: |
        Devuelve JWT de acceso y refresh token.
        5 intentos por minuto por IP y por correo (Redis).
        Los fallos suman al bloqueo de Identity.
        SCRUM-56.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar tokens con refresh token
      description: |
        Rotación de refresh token: el antiguo queda invalidado.
        SCRUM-56.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: |
        Revoca el refresh token actual.
        SCRUM-56.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/google:
    post:
      tags: [Auth]
      summary: Autenticar o vincular con Google
      description: |
        Valida el token de Google, la audiencia y `email_verified`.
        Si el correo pertenece a una cuenta, se vincula solo con ambos verificados.
        Primer ingreso externo → PENDING_APPROVAL.
        Correo con `hd = ucb.edu.bo` se trata como institucional.
        La API acepta la lista de IDs de cliente configurada.
        SCRUM-104.
      operationId: googleAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Autenticación exitosa o cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar enlace de recuperación de contraseña
      description: |
        Envía enlace de un solo uso válido 30 min.
        Respuesta no reveladora. Límites por cuenta e IP.
        SCRUM-105.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta genérica no reveladora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer contraseña con token de recuperación
      description: |
        Token de un solo uso, válido 30 min.
        SCRUM-105.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Reenviar OTP de verificación
      description: |
        Genera un nuevo OTP y lo envía al correo del registro pendiente.
        Respuesta no reveladora. Sujeto a límites de intentos.
        SCRUM-55.
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: OTP reenviado (respuesta genérica)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ──────────────────────────────────────────────
  # CUENTAS EXTERNAS — Aprobación / Rechazo
  # ──────────────────────────────────────────────

  /accounts/approval-requests:
    get:
      tags: [Accounts]
      summary: Listar solicitudes de aprobación de cuentas externas
      description: |
        Solo ADMIN. Lista las solicitudes pendientes, aprobadas y rechazadas.
        SCRUM-108.
      operationId: listApprovalRequests
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, ACTIVE, REJECTED]
      responses:
        '200':
          description: Lista paginada de solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /accounts/approval-requests/{requestId}/approve:
    post:
      tags: [Accounts]
      summary: Aprobar cuenta externa
      description: |
        Solo ADMIN. Cambia la cuenta a ACTIVE.
        SCRUM-108.
      operationId: approveAccount
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      responses:
        '200':
          description: Cuenta aprobada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts/approval-requests/{requestId}/reject:
    post:
      tags: [Accounts]
      summary: Rechazar cuenta externa
      description: |
        Solo ADMIN. Cambia la cuenta a REJECTED. Motivo obligatorio.
        Nueva solicitud permitida un día después del rechazo. Se conserva historial.
        SCRUM-108.
      operationId: rejectAccount
      parameters:
        - $ref: '#/components/parameters/RequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAccountRequest'
      responses:
        '200':
          description: Cuenta rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ──────────────────────────────────────────────
  # ADMIN GRANTS — Solicitud y doble aprobación
  # ──────────────────────────────────────────────

  /admin-grants:
    get:
      tags: [AdminGrants]
      summary: Listar solicitudes de concesión de ADMIN
      description: |
        Solo ADMIN. Muestra solicitudes pendientes y resueltas.
        SCRUM-107.
      operationId: listAdminGrants
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Lista paginada de solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminGrantRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [AdminGrants]
      summary: Crear solicitud para nuevo ADMIN
      description: |
        Solo ADMIN. Crea una solicitud de concesión de rol ADMIN
        para un usuario activo. Requiere dos aprobaciones de ADMIN distintos
        (y distintos del beneficiario). Nunca menos de 2 ADMIN activos.
        SCRUM-107.
      operationId: createAdminGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminGrantRequest'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGrantRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin-grants/{grantId}/approve:
    post:
      tags: [AdminGrants]
      summary: Aprobar solicitud de ADMIN
      description: |
        Solo ADMIN (distinto del solicitante y del beneficiario).
        Con la segunda aprobación se otorga el rol.
        SCRUM-107.
      operationId: approveAdminGrant
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
      responses:
        '200':
          description: Aprobación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGrantRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin-grants/{grantId}/reject:
    post:
      tags: [AdminGrants]
      summary: Rechazar solicitud de ADMIN
      description: |
        Solo ADMIN. Rechaza la solicitud de concesión.
        SCRUM-107.
      operationId: rejectAdminGrant
      parameters:
        - $ref: '#/components/parameters/GrantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAdminGrantRequest'
      responses:
        '200':
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGrantRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ──────────────────────────────────────────────
  # ROLE ASSIGNMENTS — Asignación y revocación
  # ──────────────────────────────────────────────

  /role-assignments:
    get:
      tags: [RoleAssignments]
      summary: Listar asignaciones de roles
      description: |
        Solo ADMIN. Lista todas las asignaciones vigentes y revocadas.
        Filtros por rol, ámbito y usuario.
      operationId: listRoleAssignments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, PROGRAM_LEADER, OPERATIONAL_LEADER]
        - name: scope
          in: query
          schema:
            type: string
            enum: [GLOBAL, PROGRAM, ACTIVITY]
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          description: Si true, solo asignaciones vigentes (no revocadas y dentro de vigencia)
          schema:
            type: boolean
      responses:
        '200':
          description: Lista paginada de asignaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleAssignments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [RoleAssignments]
      summary: Asignar un rol contextual
      description: |
        Solo ADMIN. Asigna PROGRAM_LEADER o OPERATIONAL_LEADER con ámbito
        PROGRAM o ACTIVITY (scope_id requerido), o ADMIN con ámbito GLOBAL
        (solo vía admin-grants). Vigencia opcional.
      operationId: createRoleAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleAssignmentRequest'
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /role-assignments/{assignmentId}:
    get:
      tags: [RoleAssignments]
      summary: Consultar una asignación de rol
      operationId: getRoleAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentIdParam'
      responses:
        '200':
          description: Detalle de la asignación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /role-assignments/{assignmentId}/revoke:
    post:
      tags: [RoleAssignments]
      summary: Revocar una asignación de rol
      description: |
        Solo ADMIN. Establece `revoked_at`. La regla de mínimo 2 ADMIN
        aplica para revocaciones de ADMIN.
      operationId: revokeRoleAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentIdParam'
      responses:
        '200':
          description: Asignación revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ──────────────────────────────────────────────
  # PROFILE — Perfil del usuario autenticado
  # ──────────────────────────────────────────────

  /profile:
    get:
      tags: [Profile]
      summary: Consultar perfil propio
      description: |
        Devuelve perfil, correos y roles del usuario autenticado.
        SCRUM-59.
      operationId: getMyProfile
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Profile]
      summary: Actualizar perfil propio
      description: |
        Actualización parcial. Cambiar el correo de acceso revoca sesiones.
        SCRUM-59, SCRUM-109.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /profile/change-email:
    post:
      tags: [Profile]
      summary: Solicitar cambio de correo de acceso
      description: |
        Envía OTP al nuevo correo. Al verificar, el correo se cambia
        y las sesiones existentes se revocan.
        SCRUM-109.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: OTP enviado al nuevo correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /profile/verify-email-change:
    post:
      tags: [Profile]
      summary: Verificar OTP del cambio de correo
      description: |
        Confirma el cambio de correo y revoca todas las sesiones.
        SCRUM-109.
      operationId: verifyEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailChangeRequest'
      responses:
        '200':
          description: Correo actualizado, sesiones revocadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /profile/set-institutional-email:
    post:
      tags: [Profile]
      summary: Establecer o cambiar correo institucional
      description: |
        Envía OTP al correo institucional (`@ucb.edu.bo`) para verificarlo.
        Solo con correo institucional verificado se pueden tener compromisos de horas.
        SCRUM-109.
      operationId: setInstitutionalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstitutionalEmailRequest'
      responses:
        '200':
          description: OTP enviado al correo institucional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

