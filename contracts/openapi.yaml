        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ──────────────────────────────────────────────
  # USERS — Gestión de usuarios y suspensión
  # ──────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: Solo ADMIN.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [PRE_REGISTERED, PENDING_VERIFICATION, PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED]
        - name: search
          in: query
          description: Búsqueda por nombre o correo
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Consultar detalle de un usuario
      description: Solo ADMIN.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Detalle del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/suspend:
    post:
      tags: [Users]
      summary: Suspender cuenta de usuario
      description: |
        Solo ADMIN. Cambia el estado a SUSPENDED, revoca todas las sesiones
        y conserva el historial. Se audita.
        SCRUM-61.
      operationId: suspendUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          description: Cuenta suspendida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{userId}/reactivate:
    post:
      tags: [Users]
      summary: Reactivar cuenta suspendida
      description: |
        Solo ADMIN. Cambia el estado de SUSPENDED a ACTIVE.
        SCRUM-61.
      operationId: reactivateUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Cuenta reactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}/change-email:
    post:
      tags: [Users]
      summary: Reemplazar el correo de acceso de una cuenta
      description: |
        Solo ADMIN, con motivo obligatorio, para quien perdió el acceso a su correo.
        Sin OTP. Revoca todas las sesiones; la persona recupera su contraseña con el correo nuevo.
        La cuenta queda verificada solo si el correo nuevo es institucional. Queda auditado.
        SCRUM-109.
      operationId: changeUserEmail
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserEmailRequest'
      responses:
        '200':
          description: Correo reemplazado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ──────────────────────────────────────────────
  # AUDIT EVENTS
  # ──────────────────────────────────────────────

  /audit-events:
    get:
      tags: [AuditEvents]
      summary: Consultar eventos de auditoría
      description: |
        Solo ADMIN. Lista paginada de eventos de auditoría.
        SCRUM-60.
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: entityType
          in: query
          description: Tipo de entidad auditada
          schema:
            type: string
        - name: entityId
          in: query
          description: ID de la entidad auditada
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          description: ID del usuario que realizó la acción
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Lista paginada de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────
  # ACADEMIC PERIODS
  # ──────────────────────────────────────────────

  /programs:
    get:
      tags: [Programs]
      summary: Listar programas
      description: |
        ADMIN y PROGRAM_LEADER ven todos (filtrados por permisos).
        SCRUM-45, SCRUM-103.
      operationId: listPrograms
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, INACTIVE]
        - name: periodId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Lista paginada de programas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPrograms'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Programs]
      summary: Crear programa
      description: |
        Solo ADMIN. Se crea en estado DRAFT.
        SCRUM-45.
      operationId: createProgram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '201':
          description: Programa creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /programs/{programId}:
    get:
      tags: [Programs]
      summary: Consultar programa
      operationId: getProgram
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      responses:
        '200':
          description: Detalle del programa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Programs]
      summary: Actualizar programa
      description: |
        ADMIN o PROGRAM_LEADER asignado. Actualización parcial.
        SCRUM-45, SCRUM-103.
      operationId: updateProgram
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgramRequest'
      responses:
        '200':
          description: Programa actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /programs/{programId}/activate:
    post:
      tags: [Programs]
      summary: Activar programa
      description: |
        ADMIN o PROGRAM_LEADER asignado. DRAFT → ACTIVE o INACTIVE → ACTIVE.
        SCRUM-103.
      operationId: activateProgram
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      responses:
        '200':
          description: Programa activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /programs/{programId}/deactivate:
    post:
      tags: [Programs]
      summary: Desactivar programa
      description: |
        ADMIN o PROGRAM_LEADER asignado. ACTIVE → INACTIVE.
        No se desactiva con actividades PUBLISHED o IN_PROGRESS.
        SCRUM-103.
      operationId: deactivateProgram
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      responses:
        '200':
          description: Programa desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /programs/{programId}/archive:
    post:
      tags: [Programs]
      summary: Archivar programa
      description: |
        ADMIN o PROGRAM_LEADER asignado. Archivado = `deleted_at`.
        No se archiva con actividades PUBLISHED o IN_PROGRESS.
        SCRUM-103.
      operationId: archiveProgram
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
              required: [reason]
      responses:
        '200':
          description: Programa archivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ──────────────────────────────────────────────
  # EQUIPOS DE PROGRAMAS
  # ──────────────────────────────────────────────

  /programs/{programId}/team:
    get:
      tags: [Programs]
      summary: Equipo de líderes del programa
      description: |
        Líderes de programa y operativos con asignación vigente y sus delegaciones a actividades
        del programa. Lo consultan ADMIN y el líder asignado. Se gestiona con /role-assignments. SCRUM-122.
      operationId: getProgramTeam
      parameters:
        - $ref: '#/components/parameters/ProgramIdParam'
      responses:
        '200':
          description: Equipo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramTeamMember'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /activities:
    get:
      tags: [Activities]
      summary: Listar actividades
      description: |
        Con filtros por programa, periodo, estado.
        SCRUM-47.
      operationId: listActivities
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: programId
          in: query
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, IN_PROGRESS, FINISHED, CANCELLED]
        - name: independent
          in: query
          description: Si true, solo actividades sin programa
          schema:
            type: boolean
        - name: groupLabel
          in: query
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
        - name: toDate
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de actividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivities'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Activities]
      summary: Crear actividad
      description: |
        ADMIN crea actividades independientes o de programa. PROGRAM_LEADER crea en sus programas.
        Se crea en DRAFT con programId opcional. El servidor asigna el periodo activo.
        Si el cliente envía periodId, debe coincidir con el periodo activo.
        SCRUM-47.
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Actividad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /activities/{activityId}:
    get:
      tags: [Activities]
      summary: Consultar actividad
      operationId: getActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      responses:
        '200':
          description: Detalle de la actividad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Activities]
      summary: Actualizar actividad
      description: |
        Tras publicar: descripción y lugar editables con auditoría;
        cupo solo hacia arriba; horario solo por reprogramación; programa fijo.
        FINISHED y CANCELLED no admiten cambios de planificación.
        SCRUM-48, SCRUM-49, SCRUM-53, decisión 18/11.
      operationId: updateActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Actividad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /activities/{activityId}/publish:
    post:
      tags: [Activities]
      summary: Publicar actividad
      description: |
        DRAFT → PUBLISHED. SCRUM-50.
      operationId: publishActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      responses:
        '200':
          description: Actividad publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{activityId}/finish:
    post:
      tags: [Activities]
      summary: Finalizar actividad
      description: |
        IN_PROGRESS → FINISHED. Solo un actor autorizado; registra `finished_at`.
        No hay finalización automática.
        SCRUM-50.
      operationId: finishActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      responses:
        '200':
          description: Actividad finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{activityId}/cancel:
    post:
      tags: [Activities]
      summary: Cancelar actividad
      description: |
        DRAFT o PUBLISHED → CANCELLED con motivo obligatorio.
        SCRUM-50.
      operationId: cancelActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelActivityRequest'
      responses:
        '200':
          description: Actividad cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /activities/{activityId}/discard:
    delete:
      tags: [Activities]
      summary: Descartar borrador de actividad
      description: |
        Solo DRAFT. Baja lógica con `deleted_at`.
        SCRUM-50.
      operationId: discardActivity
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      responses:
        '204':
          description: Borrador descartado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ──────────────────────────────────────────────
  # ACTIVITY RESCHEDULES
  # ──────────────────────────────────────────────

  /activities/{activityId}/reschedules:
    get:
      tags: [ActivityReschedules]
      summary: Listar reprogramaciones de una actividad
      description: SCRUM-51.
      operationId: listActivityReschedules
      parameters:
        - $ref: '#/components/parameters/ActivityIdParam'
      responses:
        '200':
          description: Lista de reprogramaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityRescheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [ActivityReschedules]
      summary: Reprogramar actividad
