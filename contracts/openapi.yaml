          in: query
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, IN_PROGRESS, FINISHED, CANCELLED]
