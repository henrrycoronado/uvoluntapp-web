        `period_id` obligatorio; si tiene programa, el periodo debe estar vinculado.
        SCRUM-47.
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Actividad creada
          content:
            application/json:
              schema:
