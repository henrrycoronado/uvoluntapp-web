# ══════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ──────── Parameters ────────

  parameters:
    PageParam:
      name: page
      in: query
      description: Número de página (empieza en 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: pageSize
      in: query
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AssignmentIdParam:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PeriodIdParam:
      name: periodId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ProgramIdParam:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ActivityIdParam:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  # ──────── Responses (Problem Details) ────────

  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Sin sesión válida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Sin permiso para esta operación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Recurso no encontrado o no visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: Conflicto de estado o concurrencia
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableEntity:
      description: Regla de negocio no cumplida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    TooManyRequests:
      description: Límite de intentos excedido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  # ──────── Schemas ────────

  schemas:
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 0
          nullable: true
      required:
      - name
      - startsAt
      - endsAt
    ActivityGroupResponse:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 0
          nullable: true
        id:
          type: string
          format: uuid
      required:
      - id
      - name
      - startsAt
      - endsAt
    ParticipationRequest:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupRequest'
        allowMultipleGroups:
          type: boolean
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
        geofenceRadiusM:
          type: integer
          nullable: true
          minimum: 1
        allowSelfCheckin:
          type: boolean
        checkinToleranceMin:
          type: integer
          minimum: 0
      required:
      - groups
    ParticipationResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ActivityGroupResponse'
        allowMultipleGroups:
          type: boolean
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
        geofenceRadiusM:
          type: integer
          nullable: true
          minimum: 1
        allowSelfCheckin:
          type: boolean
        checkinToleranceMin:
          type: integer
          minimum: 0
      required:
      - groups
      - allowMultipleGroups
    EnrollmentRequest:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
          nullable: true
    EnrollmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - ENROLLED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        participantName:
          type: string
          nullable: true
          description: Solo en la lista de inscripciones de una actividad, para quien la gestiona.
        participantEmail:
          type: string
          nullable: true
          description: Solo en la lista de inscripciones de una actividad, para quien la gestiona.
      required:
      - id
      - userId
      - activityId
      - status
      - createdAt
    PeriodEditRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 20
        endDate:
          type: string
          format: date
          nullable: true
      required:
      - label
    PeriodCloseRequest:
      type: object
      properties:
        successorLabel:
          type: string
          maxLength: 20
      required:
      - successorLabel

    # ── Problem Details (RFC 9457) ──

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details
      properties:
        code: {type: string, description: Código de rechazo para el cliente}
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema
        title:
          type: string
          description: Resumen legible del problema
        status:
          type: integer
          description: Código HTTP
        detail:
          type: string
          description: Explicación específica de esta ocurrencia
        instance:
          type: string
          format: uri
          description: URI de la ocurrencia
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Errores de validación por campo (opcional)
      required:
        - type
        - title
        - status

    # ── Pagination ──

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - pageSize
        - totalCount
        - totalPages

    # ── Generic ──

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ── Auth Schemas ──

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          maxLength: 30
          description: Teléfono de contacto; se guarda en el perfil
      required:
        - email
        - password
        - firstName
        - lastName
        - phone

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          description: Mensaje genérico no revelador
        requiresOtp:
          type: boolean
      required:
        - message
        - requiresOtp

    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          description: OTP de 6 dígitos
      required:
        - email
        - code

    VerifyOtpResponse:
      type: object
      properties:
        accountStatus:
          type: string
          enum: [ACTIVE, PENDING_APPROVAL]
          description: Estado resultante de la cuenta
        requiresApprovalData:
          type: boolean
          description: Si true, el cliente debe llamar a /auth/complete-registration
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
        - accountStatus
        - requiresApprovalData

    CompleteRegistrationRequest:
      type: object
      description: Datos adicionales para cuentas externas en PENDING_APPROVAL
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        relationWithPastoral:
          type: string
          description: Relación con la Pastoral Universitaria
      required:
        - email
        - firstName
        - lastName
        - phone
        - relationWithPastoral

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT de acceso
        refreshToken:
          type: string
          description: Refresh token (opaco)
        expiresAt:
          type: string
          format: date-time
          description: Expiración del access token (UTC)
      required:
        - accessToken
        - refreshToken
        - expiresAt

    TokenPair:
      type: object
      description: Par de tokens, presente solo cuando la cuenta es ACTIVE
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - accessToken
        - refreshToken
        - expiresAt

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    GoogleAuthRequest:
      type: object
      properties:
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 30}
        idToken:
          type: string
          description: Token ID de Google
      required:
        - idToken

    GoogleAuthResponse:
      type: object
      properties:
        requiresProfileData:
          type: boolean
          description: La web debe repetir la solicitud con el ID token vigente y los datos personales completos antes de abrir la cuenta institucional.
        accountStatus:
          type: string
          enum: [PRE_REGISTERED, PENDING_VERIFICATION, ACTIVE, PENDING_APPROVAL, REJECTED, SUSPENDED]
        isNewAccount:
          type: boolean
        tokens:
          $ref: '#/components/schemas/TokenPair'
        email:
          type: string
          format: email
        requiresApprovalData:
          type: boolean
          description: Si true, el cliente debe llamar a /auth/complete-registration
        firstName:
          type: string
          nullable: true
          description: Nombre de Google; al completar datos de Google
        lastName:
          type: string
          nullable: true
          description: Apellido de Google; al completar datos de Google
      required:
        - accountStatus
        - isNewAccount
        - email
        - requiresApprovalData

    ReapplyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          maxLength: 30
        relationWithPastoral:
          type: string
      required: [email, password, firstName, lastName, phone, relationWithPastoral]

    SetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
        password:
          type: string
          format: password
          minLength: 8
      required:
        - email
        - code
        - password

    SetPasswordResponse:
      type: object
      properties:
        accountStatus:
          type: string
          enum: [ACTIVE, PENDING_APPROVAL]
        tokens:
          $ref: '#/components/schemas/TokenResponse'
      required:
        - accountStatus

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Token de un solo uso del enlace de recuperación
        newPassword:
          type: string
          format: password
          minLength: 8
      required:
        - token
        - newPassword

    ResendOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    # ── Account Approval ──

    ApprovalRequestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        relationWithPastoral:
          type: string
        status:
          type: string
          enum: [PENDING_APPROVAL, ACTIVE, REJECTED]
        rejectionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - userId
        - email
        - firstName
        - lastName
        - status
        - createdAt

    PaginatedApprovalRequests:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequestSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    RejectAccountRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason

    # ── Admin Grants ──

    CreateAdminGrantRequest:
      type: object
      properties:
        beneficiaryId:
          type: string
          format: uuid
          description: ID del usuario que recibirá el rol ADMIN
      required:
        - beneficiaryId

    AdminGrantRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/AdminGrantApproval'
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - beneficiaryId
        - requestedBy
        - status
        - approvals
        - createdAt

    AdminGrantApproval:
      type: object
      properties:
        approverId:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
      required:
        - approverId
        - approvedAt

    PaginatedAdminGrantRequests:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminGrantRequestResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    RejectAdminGrantRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason

    # ── Role Assignments ──

    CreateRoleAssignmentRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [PROGRAM_LEADER, OPERATIONAL_LEADER]
          description: ADMIN se asigna vía admin-grants
        scope:
          type: string
          enum: [PROGRAM, ACTIVITY]
        scopeId:
          type: string
          format: uuid
          description: ID del programa o actividad
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
      required:
        - userId
        - role
        - scope
        - scopeId

    RoleAssignmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, PROGRAM_LEADER, OPERATIONAL_LEADER]
        scope:
          type: string
          enum: [GLOBAL, PROGRAM, ACTIVITY]
        scopeId:
          type: string
          format: uuid
          nullable: true
          description: Nulo solo para ámbito GLOBAL
        grantedBy:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - role
        - scope
        - grantedBy
        - createdAt

    PaginatedRoleAssignments:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    # ── Profile ──

    ProfileResponse:
      type: object
      properties:
        imagePresent: {type: boolean}
        imageUrl: {type: string, nullable: true, description: Ruta de lectura de la imagen. Usar la representación predeterminada cuando sea nula.}
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        institutionalEmail:
          type: string
          format: email
          nullable: true
        institutionalEmailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        accountStatus:
          type: string
          enum: [PRE_REGISTERED, PENDING_VERIFICATION, PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentResponse'
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de verificación; los registros históricos pueden reflejar decisiones administrativas anteriores
      required:
        - id
        - email
        - firstName
        - lastName
        - accountStatus
        - roles
        - createdAt

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true

    ChangeEmailRequest:
      type: object
      properties:
        newEmail:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Contraseña actual para confirmar
      required:
        - newEmail
        - password

    VerifyEmailChangeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
      required:
        - code

    SetInstitutionalEmailRequest:
      type: object
      properties:
        institutionalEmail:
          type: string
          format: email
          description: Debe terminar en @ucb.edu.bo
      required:
        - institutionalEmail

    VerifyInstitutionalEmailRequest:
      type: object
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
      required:
        - code

    # ── Users (admin) ──

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        accountStatus:
          type: string
          enum: [PRE_REGISTERED, PENDING_VERIFICATION, PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED]
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de verificación; los registros históricos pueden reflejar decisiones administrativas anteriores
      required:
        - id
        - email
        - firstName
        - lastName
        - accountStatus
        - createdAt

    PaginatedUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    UserDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
        institutionalEmail:
          type: string
          format: email
          nullable: true
        institutionalEmailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        accountStatus:
          type: string
          enum: [PRE_REGISTERED, PENDING_VERIFICATION, PENDING_APPROVAL, ACTIVE, REJECTED, SUSPENDED]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentResponse'
        createdAt:
          type: string
          format: date-time
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de verificación; los registros históricos pueden reflejar decisiones administrativas anteriores
      required:
        - id
        - email
        - firstName
        - lastName
        - accountStatus
        - roles
        - createdAt

    ChangeUserEmailRequest:
      type: object
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 256
        reason:
          type: string
          maxLength: 500
      required: [newEmail, reason]

    SuspendUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason

    # ── Audit Events ──

    AuditEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
          description: Nulo si la acción es del sistema
        actorType:
          type: string
          enum: [USER, SYSTEM]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorType
        - action
        - entityType
        - entityId
        - createdAt

    PaginatedAuditEvents:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    # ── Academic Periods ──

    AcademicPeriodResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startDate:
          type: string
          format: date-time
        status: {type: string, enum: [ACTIVE, CLOSED]}
        endDate:
          nullable: true
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - label
        - startDate
        - endDate
        - createdAt



    # ── Programs ──

    CreateProgramRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
          maxLength: 300
        referenceSchedule:
          type: string
          nullable: true
          maxLength: 500
      required:
        - name

    UpdateProgramRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
          maxLength: 300
        referenceSchedule:
          type: string
          nullable: true
          maxLength: 500

    ProgramResponse:
      type: object
      properties:
        imagePresent: {type: boolean}
        imageUrl: {type: string, nullable: true, description: Ruta de lectura de la imagen. Usar la representación predeterminada cuando sea nula.}
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        contact:
          type: string
          nullable: true
        referenceSchedule:
          type: string
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        canManage:
          type: boolean
          description: El actor puede gestionar este programa (ADMIN o líder asignado)
      required:
        - id
        - name
        - status
        - createdAt

    PaginatedPrograms:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgramResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    # ── Activities ──

    CreateActivityRequest:
      type: object
      properties:
        programId:
          type: string
          format: uuid
          nullable: true
          description: Nulo para actividad independiente
        periodId:
          type: string
          format: uuid
          description: Si se envía debe coincidir con el periodo activo. El servidor lo asigna.
        title:
          type: string
        description:
          type: string
          nullable: true
        modality:
          type: string
          enum: [IN_PERSON, VIRTUAL, HYBRID]
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Debe ser posterior a startsAt
        capacity:
          type: integer
          minimum: 0
          nullable: true
          description: Nulo = sin límite
        meetingUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Obligatorio para publicar si la modalidad es VIRTUAL o HYBRID
        requiresRegistration:
          type: boolean
          description: Requiere registro previo. Sin registro previo no hay cupo.
        expectedHours:
          type: number
          nullable: true
          description: Horas previstas, solo informativas
        participationConditions:
          type: string
          nullable: true
          maxLength: 2000
        groupLabel:
          type: string
          nullable: true
          maxLength: 100
          description: Etiqueta para agrupar actividades libres
      required:
        - title
        - modality
        - startsAt
        - endsAt

    UpdateActivityRequest:
      type: object
      required: [title, modality, startsAt, endsAt]
      description: |
        Enviar la ficha completa. Tras publicar: solo description, location y capacity (hacia arriba) son editables.
        Horario solo por reprogramación. Programa fijo.
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        modality:
          type: string
          enum: [IN_PERSON, VIRTUAL, HYBRID]
        location:
          type: string
          nullable: true
        capacity:
          type: integer
          minimum: 0
          nullable: true
        meetingUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Obligatorio para publicar si la modalidad es VIRTUAL o HYBRID
        requiresRegistration:
          type: boolean
          description: Requiere registro previo. Sin registro previo no hay cupo.
        expectedHours:
          type: number
          nullable: true
          description: Horas previstas, solo informativas
        participationConditions:
          type: string
          nullable: true
          maxLength: 2000
        groupLabel:
          type: string
          nullable: true
          maxLength: 100
          description: Etiqueta para agrupar actividades libres
        startsAt:
          type: string
          format: date-time
          description: Solo en DRAFT; publicada se reprograma
        endsAt:
          type: string
          format: date-time

    ActivityResponse:
      type: object
      properties:
        imagePresent: {type: boolean}
        imageUrl: {type: string, nullable: true, description: Ruta de lectura de la imagen. Usar la representación predeterminada cuando sea nula.}
        participation: {$ref: '#/components/schemas/ParticipationResponse'}
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
          nullable: true
        periodId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        modality:
          type: string
          enum: [IN_PERSON, VIRTUAL, HYBRID]
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          nullable: true
        status:
          type: string
          enum: [DRAFT, PUBLISHED, IN_PROGRESS, FINISHED, CANCELLED]
        cancellationReason:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento en que pasó a IN_PROGRESS
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        meetingUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Obligatorio para publicar si la modalidad es VIRTUAL o HYBRID
        requiresRegistration:
          type: boolean
          description: Requiere registro previo. Sin registro previo no hay cupo.
        expectedHours:
          type: number
          nullable: true
          description: Horas previstas, solo informativas
        participationConditions:
          type: string
          nullable: true
          maxLength: 2000
        groupLabel:
          type: string
          nullable: true
          maxLength: 100
          description: Etiqueta para agrupar actividades libres
        programName:
          type: string
          nullable: true
        canManage:
          type: boolean
      required:
        - id
        - periodId
        - title
        - modality
        - startsAt
        - endsAt
        - status
        - createdAt

    PaginatedActivities:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - items
        - meta

    CancelActivityRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason

    # ── Activity Reschedules ──

    RescheduleActivityRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
        newStartsAt:
          type: string
          format: date-time
        newEndsAt:
          type: string
          format: date-time
          description: Debe ser posterior a newStartsAt
      required:
        - reason
        - newStartsAt
        - newEndsAt

    RescheduleActivityResponse:
      type: object
      properties:
        activity:
          $ref: '#/components/schemas/ActivityResponse'
        reschedule:
          $ref: '#/components/schemas/ActivityRescheduleResponse'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictWarning'
          description: Advertencias de solapamiento (no bloquean)
      required:
        - activity
        - reschedule
        - conflicts

    ActivityRescheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        reason:
          type: string
        previousStartsAt:
          type: string
          format: date-time
        previousEndsAt:
          type: string
          format: date-time
        newStartsAt:
          type: string
          format: date-time
        newEndsAt:
          type: string
          format: date-time
        rescheduledBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - activityId
        - reason
        - previousStartsAt
        - previousEndsAt
        - newStartsAt
        - newEndsAt
        - rescheduledBy
        - createdAt

    # ── Conflict Check ──



    ProgramTeamMember:
      type: object
      properties:
        assignmentId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string}
        role: {type: string, enum: [PROGRAM_LEADER, OPERATIONAL_LEADER]}
        scope: {type: string, enum: [PROGRAM, ACTIVITY]}
        scopeId: {type: string, format: uuid}
        activityTitle: {type: string, nullable: true}
        validFrom: {type: string, format: date-time, nullable: true}
        validUntil: {type: string, format: date-time, nullable: true}
        grantedBy: {type: string, format: uuid}
      required: [assignmentId, userId, fullName, role, scope, scopeId]

    CheckConflictsRequest:
      type: object
      properties:
        activityId:
          type: string
          format: uuid
          nullable: true
          description: ID de la actividad existente (nulo al crear)
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        programId:
          type: string
          format: uuid
          nullable: true
          description: Programa de una actividad nueva (define sus responsables)
      required:
        - startsAt
        - endsAt

    CheckConflictsResponse:
      type: object
      properties:
        hasConflicts:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictWarning'
      required:
        - hasConflicts
        - conflicts

    ConflictWarning:
      type: object
      properties:
        type:
          type: string
          enum: [LEADER_OVERLAP, LOCATION_OVERLAP]
        conflictingActivityId:
          type: string
          format: uuid
        conflictingActivityTitle:
          type: string
        message:
          type: string
      required:
        - type
        - conflictingActivityId
        - conflictingActivityTitle
        - message

