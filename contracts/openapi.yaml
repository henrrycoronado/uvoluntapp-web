  /profile/verify-institutional-email:
    post:
      tags: [Profile]
      summary: Verificar OTP del correo institucional
      description: |
        Confirma y verifica el correo institucional.
        SCRUM-109.
      operationId: verifyInstitutionalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyInstitutionalEmailRequest'
      responses:
        '200':
          description: Correo institucional verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
